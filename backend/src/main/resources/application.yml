spring:
  application:
    name: librotdea
  datasource:
    url: jdbc:h2:mem:book
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
management:
  endpoint:
    health:
      show-details: always
